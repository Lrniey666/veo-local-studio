<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Veo Local Studio</title>
  <desc id="desc">A Windows desktop client for Veo 3.1, with an optional Discord bot.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#e8c15a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6cb6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#e8c15a"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #11141c; }
    .ink { fill: #f4f1ea; }
    .muted { fill: #8b93a7; }
    .gold { fill: #e8c15a; }
    .indigo { fill: #5865f2; }
    .chip { fill: #1a1e29; stroke: #2a3142; stroke-width: 1; }
    .chip-text { fill: #f4f1ea; font: 600 18px "Segoe UI", "Helvetica Neue", sans-serif; }
    .title { fill: #f4f1ea; font: 700 58px "Segoe UI", "Helvetica Neue", sans-serif; letter-spacing: 0.4px; }
    .tag { fill: #8b93a7; font: 400 21px "Segoe UI", "Helvetica Neue", sans-serif; }
    .rule { stroke: #e8c15a; stroke-width: 4; stroke-linecap: round; }
    .sprocket { fill: #1a1e29; stroke: #2a3142; }
    .cell { fill: #0c0e14; stroke: #2a3142; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f6f4ee; }
      .ink, .title, .chip-text { fill: #11141c; }
      .muted, .tag { fill: #5c6374; }
      .chip { fill: #ffffff; stroke: #d9d3c4; }
      .sprocket { fill: #ffffff; stroke: #d9d3c4; }
      .cell { fill: #ece8de; stroke: #d9d3c4; }
    }
  </style>
  <rect class="bg" width="1200" height="360" rx="28"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#wash)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27" fill="none" stroke="url(#frame-glow)" stroke-opacity="0.35"/>

  <g transform="translate(44 78)">
    <rect class="sprocket" x="0" y="0" width="36" height="204" rx="8"/>
    <circle class="gold" cx="18" cy="22" r="6"/>
    <circle class="gold" cx="18" cy="62" r="6"/>
    <circle class="gold" cx="18" cy="102" r="6"/>
    <circle class="gold" cx="18" cy="142" r="6"/>
    <circle class="gold" cx="18" cy="182" r="6"/>
    <rect class="cell" x="44" y="8" width="132" height="188" rx="10"/>
    <rect x="58" y="28" width="104" height="64" rx="8" fill="#5865f2" fill-opacity="0.85"/>
    <rect x="58" y="104" width="64" height="10" rx="5" fill="#e8c15a"/>
    <rect x="58" y="124" width="88" height="8" rx="4" fill="#8b93a7" fill-opacity="0.55"/>
    <rect x="58" y="142" width="76" height="8" rx="4" fill="#8b93a7" fill-opacity="0.35"/>
    <rect class="sprocket" x="184" y="0" width="36" height="204" rx="8"/>
    <circle class="gold" cx="202" cy="22" r="6"/>
    <circle class="gold" cx="202" cy="62" r="6"/>
    <circle class="gold" cx="202" cy="102" r="6"/>
    <circle class="gold" cx="202" cy="142" r="6"/>
    <circle class="gold" cx="202" cy="182" r="6"/>
  </g>

  <text class="title" x="292" y="148">Veo Local Studio</text>
  <line class="rule" x1="292" y1="172" x2="368" y2="172"/>
  <text class="tag" x="292" y="210">Windows desktop · Veo 3.1 · optional Discord bot</text>
  <g transform="translate(292 248)">
    <rect class="chip" width="132" height="40" rx="20"/>
    <text class="chip-text" x="66" y="26" text-anchor="middle">Desktop</text>
    <rect class="chip" x="144" width="132" height="40" rx="20"/>
    <text class="chip-text" x="210" y="26" text-anchor="middle">Discord</text>
    <rect class="chip" x="288" width="150" height="40" rx="20"/>
    <text class="chip-text" x="363" y="26" text-anchor="middle">7 gen types</text>
  </g>
</svg>
