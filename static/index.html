<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veo 3.1 Local Studio</title>
    <link rel="icon" href="/static/assets/oeu4f-vstm7-001.ico" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <div class="brand">
          <img src="/static/assets/oeu4f-vstm7-001.ico" alt="logo" />
          <div>
            <div>Veo 3.1</div>
            <div class="small">Local Studio</div>
          </div>
        </div>
        <div class="sidebar-content">
          <button class="btn btn-primary" id="newConversationBtn">+ 新對話</button>
          <div id="conversationList"></div>
          <a class="btn" href="/help" target="_blank">使用說明</a>
        </div>
      </aside>

      <main class="main">
        <div class="main-header">
          <strong id="currentConversationTitle">尚未選擇對話</strong>
          <div style="display: flex; gap: 8px">
            <button id="themeBtn" class="btn">切換主題</button>
            <button id="saveConfigBtn" class="btn">儲存 API 設定</button>
          </div>
        </div>

        <section class="command-area">
          <div class="card">
            <h3>API 與模型設定</h3>
            <div style="display: grid; gap: 10px">
              <input id="apiBase" placeholder="API Base URL (例如 https://api.example.com/veo)" />
              <input id="apiKey" placeholder="API Key (留空表示不覆蓋現有)" />
              <input id="modelName" value="veo-3.1" placeholder="模型名稱" />
              <input id="maxImageInputs" type="number" value="8" min="1" max="20" />
              <label><input id="discordEnabled" type="checkbox" /> 啟用 Discord Bot（重啟生效）</label>
              <input id="discordToken" placeholder="Discord Bot Token (留空表示不覆蓋現有)" />
              <div class="small" id="maskedKeyText"></div>
            </div>
          </div>

          <div class="card">
            <h3>輸入命令</h3>
            <div style="display: grid; gap: 10px">
              <textarea id="promptInput" rows="6" placeholder="輸入影片生成描述（文字）"></textarea>
              <input id="imageInput" type="file" accept="image/*" multiple />
              <div class="grid-3">
                <select id="durationSelect">
                  <option value="4">4 秒</option>
                  <option value="6">6 秒</option>
                  <option value="8" selected>8 秒</option>
                  <option value="12">12 秒</option>
                </select>
                <select id="aspectSelect">
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="1:1">1:1</option>
                  <option value="4:3">4:3</option>
                </select>
                <select id="qualitySelect">
                  <option value="720p">720p</option>
                  <option value="1080p" selected>1080p</option>
                  <option value="2k">2K</option>
                  <option value="4k">4K</option>
                </select>
              </div>
              <button class="btn btn-primary" id="generateBtn">生成影片</button>
              <div id="generateStatus" class="small"></div>
            </div>
          </div>
        </section>
      </main>

      <aside class="panel panel-right">
        <div class="brand">
          <div>
            <div>歷史命令</div>
            <div class="small">可載入修改並再次生成</div>
          </div>
        </div>
        <div id="historyList" class="history-content"></div>
      </aside>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
